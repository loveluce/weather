
name: Deploy GYEOP website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Check website files
        run: |
          ls -la GYEOP_GitHub_Pages_v1
          test -f GYEOP_GitHub_Pages_v1/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: GYEOP_GitHub_Pages_v1

      - id: deployment
        uses: actions/deploy-pages@v4
